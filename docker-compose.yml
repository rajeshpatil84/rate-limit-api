version: '3.9'

services:
  api:
    build: .
    container_name: rate-limiter-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
    volumes:
      # Persist the SQLite database across container restarts
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
